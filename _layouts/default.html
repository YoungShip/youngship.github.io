<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23192942'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='27' font-family='Georgia' fill='%23fff'%3Ey%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="YoungShip 首页"><span class="monogram" aria-hidden="true">y.</span><span>{{ site.title | escape }}</span></a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/notes/' | relative_url }}" {% if page.nav == 'notes' or page.layout == 'post' %}aria-current="page"{% endif %}>记录</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.nav == 'about' %}aria-current="page"{% endif %}>关于</a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="footer"><span>© {{ 'now' | date: '%Y' }} {{ site.title | escape }}</span><span><a href="{{ '/admin/' | relative_url }}">写作后台</a> <span aria-hidden="true">/</span> <a href="{{ '/admin/help/' | relative_url }}">写作说明</a> <span aria-hidden="true">/</span> <a href="https://github.com/YoungShip">GitHub</a></span></footer>
  </div>
</body>
</html>
